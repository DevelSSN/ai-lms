quarkus.application.name=ailms-orchestrator

quarkus.http.port=10082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:7432/ailms
quarkus.datasource.username=ailms
quarkus.datasource.password=${AILMS_PASSWORD}
%dev.quarkus.datasource.password=${AILMS_PASSWORD:ailms}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.packages=com.ailms.common.entity

quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.password=${REDIS_PASSWORD}
%dev.quarkus.redis.password=${REDIS_PASSWORD:redis}

quarkus.langchain4j.ollama.chat-model.model-name=deepseek-r1:7b
quarkus.langchain4j.ollama.chat-model.temperature=0 
quarkus.langchain4j.timeout=300s

quarkus.langchain4j.ollama-quiz.chat-model.model-name=deepseek-r1:7b
quarkus.langchain4j.ollama-quiz.chat-model.temperature=0
quarkus.langchain4j.ollama-quiz.chat-model.format=json

quarkus.langchain4j.qdrant.host=localhost
quarkus.langchain4j.qdrant.port=10634
quarkus.langchain4j.qdrant.api-key=${QDRANT_API_KEY}
%dev.quarkus.langchain4j.qdrant.api-key=${QDRANT_API_KEY:qdrant}
quarkus.langchain4j.qdrant.collection.name=ailms-content

# Qdrant collection pre-creation uses the REST admin API (HTTP 6333 / host 10633),
# which is distinct from the LangChain4j gRPC port above (6334 / host 10634).
qdrant.admin.host=${QDRANT_ADMIN_HOST:localhost}
qdrant.admin.http-port=${QDRANT_ADMIN_HTTP_PORT:10633}
qdrant.vector.size=768

quarkus.langchain4j.chat-memory.type=MESSAGE_WINDOW
quarkus.langchain4j.chat-memory.memory-window.max-messages=20

quarkus.langchain4j.ollama.embedding-model.model-name=nomic-embed-text

# Ollama runs standalone (docker run / ollama serve) — never let Quarkus
# auto-start an Ollama container via Dev Services during dev/test.
quarkus.langchain4j.ollama.devservices.enabled=false

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:11092}
mp.messaging.connector.smallrye-kafka.topic-auto-creation.enable=true
mp.messaging.connector.smallrye-kafka.topic-auto-creation.replication-factor=1
mp.messaging.connector.smallrye-kafka.topic-auto-creation.partitions=1
mp.messaging.outgoing.proactive-events-out.connector=smallrye-kafka
mp.messaging.outgoing.proactive-events-out.topic=proactive-events
mp.messaging.outgoing.proactive-events-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.content-analysis-complete-out.connector=smallrye-kafka
mp.messaging.outgoing.content-analysis-complete-out.topic=content-analysis-complete
mp.messaging.outgoing.content-analysis-complete-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.profile-updated-out.connector=smallrye-kafka
mp.messaging.outgoing.profile-updated-out.topic=profile-updated
mp.messaging.outgoing.profile-updated-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

mp.messaging.outgoing.insight-generated-out.connector=smallrye-kafka
mp.messaging.outgoing.insight-generated-out.topic=insight-generated
mp.messaging.outgoing.insight-generated-out.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

quarkus.native.resources.includes=application.properties
quarkus.native.additional-build-args=--enable-url-protocols=http,https

quarkus.s3.endpoint-override=http://localhost:19000
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:ailms}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minio123}
quarkus.s3.path-style-access=true

ailms.youtube.oembed-timeout=3s
ailms.youtube.search-timeout=5s
youtube.api.key=${YOUTUBE_API_KEY:}

ailms.proactive.inactivity-cutoff=15m
