quarkus.application.name=ailms-orchestrator-test
quarkus.http.port=10083
quarkus.http.test-port=10083

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.packages=com.ailms.common.entity

quarkus.redis.devservices.enabled=false

quarkus.langchain4j.ollama.chat-model.model-name=test
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.timeout=5s
quarkus.langchain4j.ollama.embedding-model.model-name=test

quarkus.langchain4j.qdrant.host=localhost
quarkus.langchain4j.qdrant.port=10633

quarkus.s3.endpoint-override=http://localhost:19000
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
quarkus.s3.path-style-access=true

kafka.bootstrap.servers=localhost:11092
