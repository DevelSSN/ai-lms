quarkus.application.name=ailms-api-gateway-test
quarkus.http.port=10081
quarkus.http.test-port=10081

quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.devservices.enabled=false

quarkus.s3.endpoint-override=http://localhost:19000
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=test
quarkus.s3.aws.credentials.static-provider.secret-access-key=test
quarkus.s3.path-style-access=true

quarkus.rest-client.orchestrator.url=http://localhost:10082
quarkus.swagger-ui.always-include=false
