<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-LMS | Intelligent Learning Companion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <meta name="keycloak-url" content="https://criticism-boating-dvds-alexander.trycloudflare.com">
</head>
<body class="dark-mode">
    <div class="app-container">
        <header>
            <div class="header-left">
                <button id="threads-toggle" class="threads-toggle" title="Threads">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="logo">
                    <span class="logo-icon">✨</span>
                    <h1>AI-LMS</h1>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" title="Toggle Theme">
                    <span class="sun-icon">☀️</span>
                    <span class="moon-icon">🌙</span>
                </button>
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">--</div>
                </div>
                <button id="logout-btn" class="logout-btn" title="Logout">⏻</button>
            </div>
        </header>

        <div id="threads-backdrop" class="threads-backdrop"></div>
        <aside id="threads-panel" class="threads-panel">
            <div class="threads-header">
                <h2>Threads</h2>
                <button id="threads-close" class="threads-close" title="Close">✕</button>
            </div>
            <button id="new-chat-btn" class="new-chat-btn">
                <span>＋</span> New chat
            </button>
            <ul id="thread-list" class="thread-list"></ul>
        </aside>

        <main id="chat-container">
            <div class="welcome-screen">
                <h2 id="welcome-name">Hello.</h2>
                <p>What would you like to learn today?</p>
                <div class="quick-actions">
                    <button class="action-btn">Explain Neural Networks</button>
                    <button class="action-btn">History of Rome</button>
                    <button class="action-btn">Quantum Physics 101</button>
                </div>
            </div>
            <div id="history-spinner" hidden></div>
        </main>

        <footer>
            <div class="input-wrapper">
                <input type="file" id="file-input" hidden>
                <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
                <button id="attach-btn" title="Attach file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <p class="footer-note">AI-LMS can make mistakes. Verify important information.</p>
        </footer>
    </div>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="keycloak.js"></script>
    <script src="app.js"></script>
    <!-- Vendored from npm (exact version, integrity-verified): marked@18.0.7 lib/marked.umd.js (sha256 7a1f8c5e...), dompurify@3.4.12 dist/purify.min.js (sha256 c45ba939...). Licenses: vendor/LICENSE.marked (MIT), vendor/LICENSE.dompurify (Apache-2.0), vendor/LICENSE-MPL (MPL-2.0). -->
</body>
</html>
