quarkus.application.name=ailms-api-gateway

quarkus.http.port=10080

quarkus.http.limits.max-body-size=25M

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:7432/ailms
quarkus.datasource.username=ailms
quarkus.datasource.password=${AILMS_PASSWORD}
%dev.quarkus.datasource.password=${AILMS_PASSWORD:ailms}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.packages=com.ailms.common.entity

quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.password=${REDIS_PASSWORD}
%dev.quarkus.redis.password=${REDIS_PASSWORD:redis}

quarkus.oidc.auth-server-url=${KC_AUTH_SERVER_URL:http://localhost:10081/realms/ailms}
quarkus.oidc.client-id=ailms-gateway
quarkus.oidc.credentials.secret=${OIDC_SECRET}
%dev.quarkus.oidc.credentials.secret=${OIDC_SECRET:ailms-gateway-secret}
quarkus.oidc.application-type=service

quarkus.rest-client.orchestrator.url=http://localhost:10082
quarkus.rest-client.orchestrator.connect-timeout=30000
quarkus.rest-client.orchestrator.read-timeout=300000
quarkus.swagger-ui.always-include=false

quarkus.s3.endpoint-override=http://localhost:19000
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:ailms}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minio123}
quarkus.s3.path-style-access=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:11092}

mp.messaging.connector.smallrye-kafka.topic-auto-creation.enable=true
mp.messaging.connector.smallrye-kafka.topic-auto-creation.replication-factor=1
mp.messaging.connector.smallrye-kafka.topic-auto-creation.partitions=1

mp.messaging.incoming.proactive-events.connector=smallrye-kafka
mp.messaging.incoming.proactive-events.topic=proactive-events
mp.messaging.incoming.proactive-events.value.deserializer=com.ailms.gateway.service.ProactiveEventDeserializer
mp.messaging.incoming.proactive-events.auto.offset.reset=latest
mp.messaging.incoming.proactive-events.group.id=ailms-gateway-sse
mp.messaging.incoming.proactive-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.proactive-events.dead-letter-queue.topic=dlq-proactive-events
mp.messaging.incoming.proactive-events.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.content-analysis-complete.connector=smallrye-kafka
mp.messaging.incoming.content-analysis-complete.topic=content-analysis-complete
mp.messaging.incoming.content-analysis-complete.value.deserializer=com.ailms.gateway.service.AgentEventDeserializer
mp.messaging.incoming.content-analysis-complete.auto.offset.reset=latest
mp.messaging.incoming.content-analysis-complete.group.id=ailms-gateway-sse
mp.messaging.incoming.content-analysis-complete.failure-strategy=dead-letter-queue
mp.messaging.incoming.content-analysis-complete.dead-letter-queue.topic=dlq-content-analysis-complete
mp.messaging.incoming.content-analysis-complete.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.profile-updated.connector=smallrye-kafka
mp.messaging.incoming.profile-updated.topic=profile-updated
mp.messaging.incoming.profile-updated.value.deserializer=com.ailms.gateway.service.AgentEventDeserializer
mp.messaging.incoming.profile-updated.auto.offset.reset=latest
mp.messaging.incoming.profile-updated.group.id=ailms-gateway-sse
mp.messaging.incoming.profile-updated.failure-strategy=dead-letter-queue
mp.messaging.incoming.profile-updated.dead-letter-queue.topic=dlq-profile-updated
mp.messaging.incoming.profile-updated.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.insight-generated.connector=smallrye-kafka
mp.messaging.incoming.insight-generated.topic=insight-generated
mp.messaging.incoming.insight-generated.value.deserializer=com.ailms.gateway.service.AgentEventDeserializer
mp.messaging.incoming.insight-generated.auto.offset.reset=latest
mp.messaging.incoming.insight-generated.group.id=ailms-gateway-sse
mp.messaging.incoming.insight-generated.failure-strategy=dead-letter-queue
mp.messaging.incoming.insight-generated.dead-letter-queue.topic=dlq-insight-generated
mp.messaging.incoming.insight-generated.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.dlq-proactive-events.connector=smallrye-kafka
mp.messaging.incoming.dlq-proactive-events.topic=dlq-proactive-events
mp.messaging.incoming.dlq-proactive-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dlq-proactive-events.group.id=ailms-gateway-dlq
mp.messaging.incoming.dlq-proactive-events.auto.offset.reset=earliest

mp.messaging.incoming.dlq-content-analysis-complete.connector=smallrye-kafka
mp.messaging.incoming.dlq-content-analysis-complete.topic=dlq-content-analysis-complete
mp.messaging.incoming.dlq-content-analysis-complete.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dlq-content-analysis-complete.group.id=ailms-gateway-dlq
mp.messaging.incoming.dlq-content-analysis-complete.auto.offset.reset=earliest

mp.messaging.incoming.dlq-profile-updated.connector=smallrye-kafka
mp.messaging.incoming.dlq-profile-updated.topic=dlq-profile-updated
mp.messaging.incoming.dlq-profile-updated.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dlq-profile-updated.group.id=ailms-gateway-dlq
mp.messaging.incoming.dlq-profile-updated.auto.offset.reset=earliest

mp.messaging.incoming.dlq-insight-generated.connector=smallrye-kafka
mp.messaging.incoming.dlq-insight-generated.topic=dlq-insight-generated
mp.messaging.incoming.dlq-insight-generated.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dlq-insight-generated.group.id=ailms-gateway-dlq
mp.messaging.incoming.dlq-insight-generated.auto.offset.reset=earliest
